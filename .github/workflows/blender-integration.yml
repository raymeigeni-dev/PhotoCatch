name: Blender GLB integration

on:
  pull_request:
  push:
    branches:
      - feat/3d-model-workspace-2026-10-23
  workflow_dispatch:

jobs:
  blender-roundtrip:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y blender python3-numpy
      - name: Report Blender version
        run: blender --version
      - name: Run GLB repair round-trip integration test
        shell: bash
        run: |
          set -euo pipefail
          log="$(mktemp)"
          blender --background --python tests/blender_roundtrip_integration.py -- tools/blender_repair.py 2>&1 | tee "$log"
          if ! grep -Fq "PHOTOCATCH_BLENDER_ROUNDTRIP=" "$log"; then
            echo "Blender exited without the required end-to-end PASS marker."
            exit 1
          fi
